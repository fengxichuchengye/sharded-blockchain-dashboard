<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分片区块链监控平台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="background-grid"></div>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Shard Ledger Observatory</p>
          <h1>分片区块链监控平台</h1>
        </div>
        <button id="compose-trigger" class="action-button" type="button">发起交易</button>
      </header>

      <section class="stats-grid" id="stats-grid">
        <article class="stat-card">
          <span>区块链总体大小</span>
          <strong id="stat-size">--</strong>
        </article>
        <article class="stat-card">
          <span>总交易数</span>
          <strong id="stat-tx">--</strong>
        </article>
        <article class="stat-card">
          <span>用户数量</span>
          <strong id="stat-users">--</strong>
        </article>
      </section>

      <section class="section-head">
        <div>
          <p class="eyebrow">Shard Chains</p>
          <h2>分片区块链结构</h2>
        </div>
        <div class="legend">
          <span><i class="legend-chip latest"></i> 最新区块</span>
          <span><i class="legend-chip regular"></i> 历史区块</span>
        </div>
      </section>

      <section id="shard-list" class="shard-list"></section>
    </main>

    <template id="block-template">
      <article class="block-card">
        <strong class="block-id"></strong>
        <span class="block-hash"></span>
        <div class="block-info">
          <span class="block-tx"></span>
          <span class="block-time"></span>
        </div>
      </article>
    </template>

    <div id="modal-overlay" class="modal-overlay hidden" aria-hidden="true">
      <section class="block-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="modal-close" class="modal-close" type="button" aria-label="Close details">
          &times;
        </button>
        <div class="modal-head">
          <div>
            <p class="eyebrow">Block Details</p>
            <h2 id="modal-title">区块详情</h2>
          </div>
          <div id="modal-badges" class="modal-badges"></div>
        </div>

        <div id="modal-meta" class="modal-meta"></div>

        <section class="tx-section">
          <div class="tx-section-head">
            <div>
              <h3>区块内前 100 笔交易</h3>
              <p>显示区块体中真实读取到的交易明细，没有交易时显示为空。</p>
            </div>
          </div>

          <div id="tx-empty" class="empty-state hidden"></div>

          <div id="tx-table-wrap" class="tx-table-wrap hidden">
            <table class="tx-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>发送方</th>
                  <th>接收方</th>
                  <th>金额</th>
                  <th>Nonce</th>
                  <th>交易哈希</th>
                </tr>
              </thead>
              <tbody id="tx-table-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </div>

    <div id="compose-overlay" class="modal-overlay hidden" aria-hidden="true">
      <section class="compose-modal compose-shell" role="dialog" aria-modal="true" aria-labelledby="compose-title">
        <button id="compose-close" class="modal-close" type="button" aria-label="Close compose">
          &times;
        </button>
        <div class="compose-panel">
          <aside class="compose-side">
            <p class="eyebrow">NEW TRANSACTION</p>
            <h2 id="compose-title">发起交易</h2>
            <p class="compose-copy">
              创建一笔新的转账请求。
            </p>

            <div class="compose-graphic" aria-hidden="true">
              <img src="./compose-graphic.svg" alt="交易分片示意图" />
            </div>

          </aside>

          <form id="compose-form" class="compose-form">
            <div class="compose-form-frame">
              <div class="compose-frame-head">
                <span class="compose-frame-label">交易录入面板</span>
                <span class="compose-frame-line"></span>
              </div>

              <label class="form-field">
                <span>发送方账户地址</span>
                <input id="tx-sender" name="sender" type="text" placeholder="请输入自己的账户地址" required />
              </label>

              <label class="form-field">
                <span>接收方账户地址</span>
                <input id="tx-recipient" name="recipient" type="text" placeholder="请输入接收方账户地址" required />
              </label>

              <label class="form-field">
                <span>转账金额</span>
                <input id="tx-value" name="value" type="text" inputmode="decimal" placeholder="请输入转账金额" required />
              </label>
            </div>

            <div id="compose-feedback" class="compose-feedback hidden"></div>

            <div class="compose-actions">
              <button class="secondary-button" id="compose-cancel" type="button">取消</button>
              <button class="primary-button compose-cta" id="compose-submit" type="submit">写入交易</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <script src="./script.js?v=6"></script>
  </body>
</html>
